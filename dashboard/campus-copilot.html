<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Copilot — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1ee;--card:#fff;--ink:#16161a;--ink2:#3b3b43;--muted:#74747d;--line:#e5e3de;--line2:#f0eeea;
  --or:#ff5f14;--or2:#ff8a4c;--orsoft:#fff1e8;--orline:#ffd3ba;
  --warn:#b42318;--warnsoft:#fdecea;--amber:#9a5a06;--ambersoft:#fdf2df;--green:#1f6f43;--greensoft:#e7f4ec;
  --night:#14152b;
  --r:18px;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(640px 400px at 88% -8%,rgba(255,138,76,.20),transparent 70%),
             radial-gradient(560px 380px at 6% 108%,rgba(120,170,255,.16),transparent 70%),
             radial-gradient(420px 300px at 55% 40%,rgba(255,236,170,.18),transparent 70%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);background:rgba(255,255,255,.6);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;color:var(--ink2);font-weight:500;font-size:14px}
.nav button:hover{background:rgba(0,0,0,.04)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px var(--line)}
.nav button.on svg{color:var(--or)}
.nav svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--orsoft);color:var(--or);padding:1px 8px;border-radius:99px}
.side .foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.side .foot b{color:var(--ink);font-weight:600;display:block;font-size:13px}

main{padding:30px 38px 100px;max-width:1260px;width:100%}

/* type */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:.98;font-size:clamp(40px,5.2vw,64px);margin:6px 0 8px}
h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:22px;margin:0}
h3{font-size:15px;margin:0;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-family:var(--mono)}

/* layout */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(20,20,30,.03)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec{margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--or)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.list>*+*{border-top:1px solid var(--line2)}
.li{padding:12px 0;display:flex;gap:12px;align-items:center}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:#cfccc5}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{background:#f05408}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.lg{padding:13px 20px;font-size:15px;border-radius:14px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sel{border-color:var(--or);color:var(--or);background:var(--orsoft)}

/* chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.or{background:var(--orsoft);color:#c2410c}
.pill.warn{background:var(--warnsoft);color:var(--warn)}
.pill.amber{background:var(--ambersoft);color:var(--amber)}
.pill.green{background:var(--greensoft);color:var(--green)}
.pill.out{background:transparent;border:1px solid var(--line)}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.none{background:var(--line2);color:var(--muted)}
.st.prog{background:#eef1f6;color:#3d4b66}
.st.help{background:var(--orsoft);color:#c2410c;border:1px dashed #f8a877}
.st.ind{background:var(--or);color:#fff}
.st.review{background:var(--ambersoft);color:var(--amber)}

/* bars */
.bar{height:8px;border-radius:99px;background:#eceae5;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--or);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.help i{background:repeating-linear-gradient(-45deg,var(--or) 0 6px,#ffb68e 6px 12px)}
.bar.review i{background:#d9962a}
.bar.prog i{background:#8a97b2}

/* waiting strip */
.wait{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
@media (max-width:600px){.wait{grid-template-columns:1fr 1fr}.wcard .n{font-size:26px}}
.wcard{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.wcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.18)}
.wcard .n{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}
.wcard .k{font-weight:600;font-size:13.5px}
.wcard .d{font-size:12px;color:var(--muted)}
.wcard.alert{border-color:#f3c6c1;background:#fffafa}
.wcard.alert .n{color:var(--warn)}

/* blob mascot */
.blobwrap{display:inline-flex;flex-direction:column;align-items:center}
.blob{animation:wob 4.2s ease-in-out infinite;transform-origin:50% 80%;overflow:visible}
.blob.happy{animation:hop .9s ease-in-out 2,wob 4.2s ease-in-out 1.8s infinite}
.blob.sleep{animation:breathe 3.2s ease-in-out infinite}
.shadow{width:60%;height:7px;border-radius:50%;background:rgba(0,0,0,.08);margin-top:2px;animation:shad 4.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg) scale(1.02,.98)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes shad{50%{transform:scale(.88)}}

/* review */
.review-wrap{max-width:860px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 30px;box-shadow:0 18px 50px -30px rgba(0,0,0,.25)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qtext{font-size:17px;line-height:1.6;margin:0 0 16px;font-weight:500}
pre.code{background:#17181c;color:#f3f3f3;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.55;overflow:auto;margin:0 0 16px}
pre.code .kw{color:#ff9a62}
.tables{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-start}
table.mini{border-collapse:collapse;font-size:13px;background:#fafaf8;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
table.mini caption{text-align:left;font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 0 5px}
table.mini th,table.mini td{padding:5px 12px;border-bottom:1px solid var(--line2);text-align:left}
table.mini th{font-weight:600;background:#f3f2ee;font-family:var(--mono);font-size:12px}
.opts{display:grid;gap:9px;margin:4px 0 18px}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;font-size:14.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:#cbc7bf}
.opt .ltr{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line2);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink2)}
.opt.on{border-color:var(--or);background:var(--orsoft)}
.opt.on .ltr{background:var(--or);color:#fff}
.opt.right{border-color:#8fc9a6;background:var(--greensoft)}
.opt.right .ltr{background:var(--green);color:#fff}
.opt.wrong{border-color:#efb4ae;background:var(--warnsoft)}
.opt.wrong .ltr{background:var(--warn);color:#fff}
.opt.dis{cursor:default}
textarea,input,select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid var(--orline);border-color:var(--or)}
.locked{margin-top:18px;border:1px dashed #d8d4cc;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(-45deg,#fbfaf8 0 8px,#f6f5f2 8px 16px)}
.gap{margin-top:18px;border-radius:16px;border:1px solid var(--orline);background:linear-gradient(180deg,#fff7f1,#fff);padding:18px 20px}
.gap .lab{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#c2410c;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.gap p{margin:0 0 10px}
.good{margin-top:18px;border-radius:16px;border:1px solid #bfe0cb;background:var(--greensoft);padding:16px 18px;display:flex;gap:14px;align-items:center}
.sol{margin-top:12px;border-radius:12px;background:#fafaf8;border:1px solid var(--line);padding:12px 14px;font-size:14px}
.vis{margin-top:12px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:14px}
.vrow{display:grid;grid-template-columns:70px 24px 1fr;gap:8px;align-items:center;font-size:13.5px;padding:4px 0}
.vrow .arrow{color:var(--or);font-weight:700}
.badge-gen{background:#eef0ff;color:#3b3fa8}

/* deadlines */
.dl{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--card);display:grid;gap:10px}
.dl+.dl{margin-top:10px}
.dl.low{border-color:#f0d9b0;background:#fffdf8}
.dl .t{font-weight:650;font-size:15.5px}
.dl .due{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.dl .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dl .links a{font-size:12.5px;color:var(--ink2);text-decoration:underline;text-decoration-color:#ccc;margin-right:12px}
.note{font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--ambersoft);color:var(--amber)}
.note.info{background:#f1f3f7;color:#3d4b66}
.sticky{position:sticky;top:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.big3 div{background:var(--line2);border-radius:12px;padding:10px;text-align:center}
.big3 b{font-family:var(--display);font-size:26px;font-weight:800;display:block;line-height:1.1}
.big3 span{font-size:11.5px;color:var(--muted)}

/* topics */
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(90px,1fr) auto auto;gap:14px;align-items:center;padding:12px 0}
.trow+.trow{border-top:1px solid var(--line2)}
.tname{font-weight:600}
.course-hero{font-family:var(--display);font-weight:800;font-size:clamp(48px,7vw,84px);letter-spacing:-.045em;line-height:.9;margin:4px 0 6px}

/* jobs */
.job{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 0}
.job+.job{border-top:1px solid var(--line2)}
.rank{font-family:var(--display);font-weight:800;font-size:28px;color:#d6d2ca;line-height:1}
.job:first-child .rank{color:var(--or)}
.fit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.fit .bar{width:110px;min-width:0;height:6px}

/* cheat sheet */
.papers{display:flex;gap:16px;flex-wrap:wrap}
.paper{width:300px;max-width:100%;flex:none;aspect-ratio:8.5/11;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 30px -18px rgba(0,0,0,.35);padding:14px 13px;overflow:hidden;position:relative;columns:2;column-gap:10px;column-rule:1px solid #f0eeea}
.paper .side-lab{position:absolute;right:8px;bottom:6px;font-size:9px;color:#aaa;column-span:all}
.paper .blk{break-inside:avoid;margin-bottom:7px}
.paper .blk h5{margin:0 0 2px;font-size:7.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--or)}
.paper .blk p{margin:0;line-height:1.25;color:#222}
.paper .blk h5{font-size:1em!important}
.overflow{opacity:.45;border:1.5px dashed var(--warn);border-radius:8px;padding:10px;font-size:12px;color:var(--warn);width:300px}
.meter{height:12px;border-radius:99px;background:#eceae5;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .4s}
.meter.over i{background:var(--warn)}
.rules{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--or);flex:none}

/* toggles */
.tg{appearance:none;width:38px;height:22px;border-radius:99px;background:#d9d6cf;position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--or)}
.tg.on::after{left:19px}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(22,22,26,.38);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:22px;padding:24px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.modal h2{margin-bottom:6px}
.field{display:grid;gap:5px;margin-top:12px;font-size:13px;font-weight:600;color:var(--ink2)}
.night{background:var(--night);color:#e9e9f5;width:min(640px,100%)}
.night .muted{color:#9c9cb8}
.log{margin-top:16px;display:grid;gap:8px;font-size:13.5px}
.log .ln{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);animation:up .35s ease-out}
.log .ln .tm{font-family:var(--mono);font-size:12px;color:#ff9a62;padding-top:1px}
.log .ln.fail .tm{color:#ff8a80}
.log .ln b{color:#fff;font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.email{font-family:var(--mono);font-size:12.5px;background:#fafaf8;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.55}
.hl{background:#ffe2cf;border-radius:3px;padding:0 2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.tabbar{display:none}
.demo-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:99px;background:#fff}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:20px 16px 110px}
  .g2,.g3{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px;justify-content:space-around;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:12px}
  .tabbar button.on{color:var(--or);background:var(--orsoft)}
  .tabbar svg{width:20px;height:20px}
  .trow{grid-template-columns:1fr auto;}
  .trow .bar{grid-column:1/-1;order:3}
  .qcard{padding:20px}
  .sticky{position:static}
  .paper{width:100%}
}

/* print: only the cheat sheet */
#print{display:none}
@media print{
  @page{size:letter;margin:0.4in}
  body{background:#fff}
  .app,.tabbar,.glow,#toast,#modal{display:none!important}
  #print{display:block}
  #print .pg{columns:2;column-gap:.25in;font-size:8pt;line-height:1.25;page-break-after:always;height:10.2in;overflow:hidden}
  #print .pg:last-child{page-break-after:auto}
  #print h5{font-size:8pt;margin:0 0 2pt;color:#c2410c;text-transform:uppercase;letter-spacing:.04em}
  #print .blk{break-inside:avoid;margin-bottom:6pt}
  #print p{margin:0 0 2pt}
}

/* ---------- Copi corner companion ---------- */
.blob .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:rotate(-18deg) scaleY(1)}96%{transform:rotate(-18deg) scaleY(.12)}}
#copi{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:var(--sans)}
#copi .pet{width:84px;height:84px;border:0;padding:0;background:#ececec;border-radius:22px;cursor:pointer;display:grid;place-items:center;box-shadow:0 14px 34px -16px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s;touch-action:none}
#copi .pet:hover{transform:translateY(-3px) scale(1.04);background:#e6e6e6}
#copi .pet:active{transform:scale(.92)}
#copi svg{overflow:visible}
#copi .body{transform-origin:50% 85%;animation:wob 4.2s ease-in-out infinite}
#copi.squish .body{animation:squish .5s cubic-bezier(.3,1.6,.5,1)}
#copi.hop .body{animation:hop .8s ease-in-out}
#copi.spin .body{animation:spin .9s cubic-bezier(.5,0,.3,1.3)}
#copi.sleepy .body{animation:breathe 3.2s ease-in-out infinite}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.18,.82)}60%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
#copi .pupils{transition:transform .12s ease-out}
#copi .bubble{max-width:270px;background:#16161a;color:#fff;padding:12px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.4;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom right;pointer-events:none;transition:.22s ease}
#copi.open .bubble{opacity:1;transform:none;pointer-events:auto}
#copi .bubble b{color:#ff9a5c}
#copi .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#copi .acts button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
#copi .acts button:hover{background:#F2783A;border-color:#F2783A}
#copi .heart{position:absolute;pointer-events:none;font-size:16px;animation:float 1s ease-out forwards}
@keyframes float{to{transform:translateY(-46px) scale(1.3);opacity:0}}
@media (max-width:860px){#copi{bottom:92px;right:14px}#copi .pet{width:66px;height:66px;border-radius:18px}}

/* ---------- Top tasks today ---------- */
.prio{margin-top:22px;padding:22px 22px 10px;background:linear-gradient(120deg,#fff 55%,#fff4ec);border-color:var(--orline)}
.prio .card-h h2{display:flex;align-items:center;gap:10px}
.prio .pmeter{font-size:12.5px;color:var(--muted);line-height:1.4;white-space:nowrap}
.prio .pbar{height:6px;border-radius:9px;background:#efe9e2;overflow:hidden;margin:4px 0 6px auto;width:170px}
.prio .pbar i{display:block;height:100%;background:var(--or);border-radius:9px;transition:width .35s}
.task{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line2)}
.task:first-of-type{border-top:0}
.task .rank{font-family:var(--display);font-weight:800;font-size:22px;color:var(--or);width:26px;text-align:center}
.task .ck{width:24px;height:24px;border-radius:8px;border:1.8px solid #cfcac2;background:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.task .ck:hover{border-color:var(--or)}
.task.done .ck{background:var(--or);border-color:var(--or)}
.task.done .ck::after{content:'';width:9px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block}
.task.done .tt b{text-decoration:line-through;color:var(--muted)}
.task.done .rank{color:#d6d1ca}
.task .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.urg{background:var(--warnsoft);color:var(--warn)}.tag.soon{background:var(--ambersoft);color:var(--amber)}.tag.exam{background:var(--orsoft);color:#c2410c}.tag.fix{background:#eef0ff;color:#3b45a8}.tag.car{background:var(--greensoft);color:var(--green)}
.task .mins{font-size:12px;color:var(--muted);width:52px;text-align:right}

/* ---------- Grok Bot chat ---------- */
#chat{position:fixed;right:22px;bottom:122px;z-index:61;width:370px;max-width:calc(100vw - 28px);height:520px;max-height:calc(100vh - 150px);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(14px) scale(.97);transform-origin:bottom right;pointer-events:none;transition:.22s ease}
#chat.open{opacity:1;transform:none;pointer-events:auto}
#chat .ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);background:linear-gradient(120deg,#fff 50%,#fff4ec)}
#chat .ch b{display:block;font-size:14.5px}
#chat .ch small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
#chat .ch small i{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
#chat .x{margin-left:auto;border:0;background:var(--line2);width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--ink2)}
#chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fcfbf9}
.m{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45}
.m.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.me{background:var(--or);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.m ul{margin:6px 0 0;padding-left:18px}.m li{margin:2px 0}
.m .go{margin-top:8px;display:inline-block;font-size:12.5px;font-weight:600;color:#c2410c;cursor:pointer;border:1px solid var(--orline);background:var(--orsoft);padding:4px 10px;border-radius:99px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#c9c4bc;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
#chat .quick{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
#chat .quick button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
#chat .quick button:hover{border-color:var(--or);color:#c2410c}
#chat form{display:flex;gap:8px;padding:10px 12px 12px}
#chat input{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;font-size:14px;outline:none}
#chat input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--orsoft)}
#chat form button{border:0;background:var(--ink);color:#fff;border-radius:14px;width:44px;cursor:pointer;font-size:17px}
@media (max-width:860px){#chat{right:14px;bottom:170px;height:460px}}
</style>
